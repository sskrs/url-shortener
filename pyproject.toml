[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, S: security checks (bandit rules)
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/*" = ["S101"]
