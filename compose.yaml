# Stage 2: the app plus its database and cache.
# Copy .env.example to .env and set a password first, then: docker compose up --build
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://shortener:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8080
      RATE_LIMIT_PER_MINUTE: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_DB: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
